name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lectra
          # Disposable job service only: this is not an application/cloud credential.
          POSTGRES_PASSWORD: lectra_ci_only
          POSTGRES_DB: lectra_ci_control
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lectra -d lectra_ci_control"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install locked dependencies and Chromium
        run: |
          npm install --global npm@10.9.2
          npm ci
          node scripts/playwright.mjs install --with-deps chromium
      - name: Check deploy scripts offline and verifier regressions
        run: |
          mkdir -p .local/ci-evidence
          set -o pipefail
          bash deploy/tests/check_offline.sh 2>&1 | tee .local/ci-evidence/offline-tests.txt
          python3 -m unittest discover -s tests/tooling -p 'test_*.py' -v 2>&1 | tee .local/ci-evidence/tooling-tests.txt
      - name: Test API/database and UI; typecheck and build
        env:
          ALLOW_CI_DATABASE_SETUP: lectra_ci_control
          CI_POSTGRES_PASSWORD: lectra_ci_only
        run: python3 scripts/verify-lab5-episode2.py --use-ci-postgres --evidence-dir .local/ci-evidence/regression
      - name: Build and verify Docker images on linux/amd64
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          python3 scripts/verify-lab5-episode3.py --create-local-containers --evidence-dir .local/ci-docker
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('.local/ci-docker/results.json').read_text())
          assert record['images']['unified']['architecture'] == 'amd64'
          PY
      - name: Upload actual CI evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci-evidence/
            .local/ci-docker/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
